<style>
:root{
  /* Layout: quiet single column of plain sections; the only graphic is Noor's own LinkedIn banner and logo. */
  --pink:#EFA3C8;
  --pink-soft:#F9DCE8;
  --rose:#C94F6D;
  --rose-ink:#B03A5B;
  --burgundy:#831638;
  --bg:#FFF8FB;
  --ink:#2E2430;
  --muted:#6B5662;
  --line:#F2C9D8;
  --f-head:"Poppins","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --max:1080px;
  --gutter:clamp(20px,5vw,40px);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance}
ul,ol{margin:0;padding:0;list-style:none}
img,svg{display:block;max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:6px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--gutter)}
section{scroll-margin-top:80px}

/* Nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,248,251,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-inner{display:flex;align-items:center;gap:16px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-head);font-weight:600;color:var(--burgundy)}
.brand img{width:36px;height:36px;border-radius:50%;border:1px solid var(--line)}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-links a{font-family:var(--f-head);font-weight:500;font-size:14px;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:8px;transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:var(--burgundy)}
.nav-links a.active{background:var(--pink-soft)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-head);font-weight:500;font-size:14.5px;line-height:1;padding:13px 20px;border-radius:10px;text-decoration:none;border:1px solid transparent;transition:background-color .2s,border-color .2s,transform .2s}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--burgundy);color:#fff}
.btn-primary:hover{background:#6c0f2d;transform:translateY(-1px)}
.btn-outline{border-color:var(--line);color:var(--burgundy);background:#fff}
.btn-outline:hover{border-color:var(--rose);transform:translateY(-1px)}

/* Hero */
.hero{padding:clamp(48px,8vw,96px) 0 clamp(56px,8vw,88px)}
.hero-grid{display:block}
.hero h1{font-size:clamp(2.8rem,6.5vw,4.4rem);font-weight:600;line-height:1.02;letter-spacing:-.03em;color:var(--burgundy)}
.hero-role{margin-top:14px;font-family:var(--f-head);font-weight:500;font-size:17px;color:var(--rose-ink)}
.hero-line{margin-top:22px;font-size:clamp(1.15rem,2vw,1.3rem);line-height:1.5;color:var(--ink);max-width:30ch}
.hero-actions{margin-top:32px;display:flex;flex-wrap:wrap;gap:10px}

/* Sections */
.section{padding:clamp(56px,8vw,88px) 0;border-top:1px solid var(--line)}
.sec-grid{display:grid;grid-template-columns:220px 1fr;gap:clamp(20px,5vw,56px)}
.sec-title{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--burgundy);padding-top:4px}

.about p{max-width:64ch;color:#43363F;font-size:17px}
.about p + p{margin-top:16px}

.skill-rows{display:grid;gap:0}
.skill-row{display:grid;grid-template-columns:230px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.skill-row:first-child{padding-top:0}
.skill-row:last-child{border-bottom:0;padding-bottom:0}
.skill-row h3{font-size:15.5px;font-weight:500;color:var(--ink);line-height:1.6}
.tags{display:flex;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;gap:8px}
.tag{font-size:13.5px;line-height:1;padding:8px 12px;border-radius:8px;background:var(--pink-soft);color:var(--burgundy);font-weight:500}

/* Projects */
.projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.project{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s ease,box-shadow .3s ease}
.project:hover{transform:translateY(-3px);box-shadow:0 18px 40px -24px rgba(131,22,56,.4)}
.project-body{padding:28px 28px 30px;display:flex;flex-direction:column;gap:12px;flex:1}
.project.feature{grid-column:1 / -1;display:grid;grid-template-columns:1.1fr 1fr}
.project.feature .project-body{padding:32px 34px;justify-content:center}
.project-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.project h3{font-size:22px;font-weight:600;line-height:1.2;color:var(--burgundy);letter-spacing:-.01em}
.project.feature h3{font-size:28px}
.status{font-size:12.5px;font-weight:500;color:#7A4A06;background:#FFF1D9;padding:4px 10px;border-radius:6px}
.project-sub{font-family:var(--f-head);font-weight:500;font-size:14.5px;color:var(--rose-ink);margin-top:-6px}
.project-desc{color:#4d3e49;font-size:15.5px}
.project .tags{margin-top:2px}
.project .tag{background:var(--bg);border:1px solid var(--line);font-size:12.5px;padding:6px 10px}
.project-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.project-links .btn{padding:10px 16px;font-size:14px}

/* Lists (experience, certifications) */
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:clamp(32px,5vw,56px)}
.sub-title{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.list li{padding:16px 0;border-bottom:1px solid var(--line)}
.list li:first-child{padding-top:0}
.list li:last-child{border-bottom:0}
.list h3{font-size:16px;font-weight:600;color:var(--ink);line-height:1.45}
.list .meta{font-size:14.5px;color:var(--rose-ink);font-weight:500;margin-top:2px}
.list .note{font-size:14.5px;color:var(--muted);margin-top:4px;line-height:1.55}

/* Contact */
.contact h2{font-size:clamp(2rem,4.5vw,2.8rem);font-weight:600;color:var(--burgundy);letter-spacing:-.02em}
.contact p{margin-top:12px;color:#4d3e49;font-size:17px;max-width:52ch}
.contact .hero-actions{margin-top:26px}
footer{padding:28px 0 40px;font-size:13.5px;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px}

/* Reveal: visible at rest, gentle rise on first view */
[data-reveal].in{animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media (max-width:860px){
  .hero-grid,.two-col{grid-template-columns:1fr}
    .sec-grid{grid-template-columns:1fr;gap:20px}
  .projects{grid-template-columns:1fr}
  .project.feature{grid-template-columns:1fr}
  .nav-links{display:none}
}
@media (max-width:560px){
  .skill-row{grid-template-columns:1fr;gap:10px}
      .project-body,.project.feature .project-body{padding:22px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

   RENDERING (no edits needed below)
   ============================================================ */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const isUrl = u => typeof u === "string" && /^https?:\/\/\S+$/i.test(u.trim());
const isEmail = e => typeof e === "string" && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e.trim());
const LOGO = document.querySelector(".brand img").src;

const ICON = {
  linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
  github: '<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  out: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'
};
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const ext = (url, cls, inner, label) => `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener noreferrer"${label ? ` aria-label="${esc(label)}"` : ""}>${inner}</a>`;
const section = (title, body) => `<div class="wrap sec-grid"><h2 class="sec-title">${title}</h2><div data-reveal>${body}</div></div>`;

function contactButtons(p, withEmail) {
  const l = p.links, out = [];
  if (isUrl(l.linkedin)) out.push(ext(l.linkedin, "btn btn-outline", `${icon("linkedin")} LinkedIn`));
  if (isUrl(l.github)) out.push(ext(l.github, "btn btn-outline", `${icon("github")} GitHub`));
  if (withEmail && isEmail(l.email)) out.push(`<a class="btn btn-outline" href="mailto:${esc(l.email)}">${icon("mail")} ${esc(l.email)}</a>`);
  if (isUrl(l.cv) || /^[\w./-]+\.pdf$/i.test(l.cv || "")) out.push(ext(l.cv, "btn btn-outline", `${icon("file")} CV`));
  return out.join("");
}

/* Sections */
function render(p) {
  const on = id => (p.sections || {})[id] !== false;
  ["skills", "certifications", "experience"].forEach(id => { if (!on(id)) document.getElementById(id).remove(); });
  const nav = [["about","About"],["skills","Skills"],["projects","Projects"],["certifications","Certifications"],["experience","Experience"],["contact","Contact"]].filter(([id]) => on(id));
  document.getElementById("nav-links").innerHTML = nav.map(([id, t]) => `<li><a href="#${id}" data-target="${id}">${t}</a></li>`).join("");

  document.getElementById("hero").innerHTML = `
    <div data-reveal>
      <h1>${esc(p.name)}</h1>
      <p class="hero-role">${esc(p.role)}</p>
      ${p.headline ? `<p class="hero-line">${esc(p.headline)}</p>` : ""}
      <div class="hero-actions"><a class="btn btn-primary" href="#projects">View projects</a>${contactButtons(p)}</div>
    </div>`;

  document.getElementById("about").innerHTML = section("About", `<div class="about">${p.about.map(t => `<p>${esc(t)}</p>`).join("")}</div>`);

  if (on("skills")) document.getElementById("skills").innerHTML = section("Skills", `<div class="skill-rows">${p.skills.map(s => `
    <div class="skill-row"><h3>${esc(s.group)}</h3><ul class="tags">${s.items.map(i => `<li class="tag">${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>`);

  const shown = p.projects.filter(pr => !pr.hidden);
  const allWide = shown.length <= 2; // with one or two projects, every card is shown full width
  document.getElementById("projects").innerHTML = section("Projects", `<div class="projects">${shown.map((pr, i) => {
    const links = [
      isUrl(pr.demo) ? ext(pr.demo, "btn btn-primary", `Live demo ${icon("out")}`, `${pr.title} live demo`) : "",
      isUrl(pr.github) ? ext(pr.github, "btn btn-outline", `${icon("github")} Code`, `${pr.title} on GitHub`) : ""
    ].join("");
    return `<article class="project">
      <div class="project-body">
        <div class="project-head"><h3>${esc(pr.title)}</h3>${pr.status ? `<span class="status">${esc(pr.status)}</span>` : ""}</div>
        <p class="project-sub">${esc(pr.subtitle)}</p>
        <p class="project-desc">${esc(pr.description)}</p>
        <ul class="tags">${pr.tags.map(t => `<li class="tag">${esc(t)}</li>`).join("")}</ul>
        ${links ? `<div class="project-links">${links}</div>` : ""}
      </div>
    </article>`;
  }).join("")}</div>`);

  const item = (title, meta, note, url) => `<li><h3>${url && isUrl(url) ? ext(url, "", esc(title)) : esc(title)}</h3><p class="meta">${esc(meta)}</p>${note ? `<p class="note">${esc(note)}</p>` : ""}</li>`;
  if (on("certifications")) document.getElementById("certifications").innerHTML = section("Certifications",
    `<ul class="list">${p.certifications.map(c => item(c.title, c.issuer, c.detail, c.url)).join("")}</ul>`);
  if (on("experience")) document.getElementById("experience").innerHTML = section("Experience", `<div class="two-col">
    <div><h3 class="sub-title">Community & activities</h3><ul class="list">${p.experience.map(e => item(e.org, e.role, e.note)).join("")}</ul></div>
    <div><h3 class="sub-title">Certifications</h3><ul class="list">${p.certifications.map(c => item(c.title, c.issuer, c.detail, c.url)).join("")}</ul></div>
  </div>`);

  document.getElementById("contact").innerHTML = `<div class="wrap" data-reveal>
    <h2>Let’s connect</h2>
    <p>I’m always open to learning opportunities, professional connections, collaborations and interesting data projects.</p>
    <div class="hero-actions">${contactButtons(p, true)}</div>
  </div>`;

  document.getElementById("footer").innerHTML = `<span>© ${new Date().getFullYear()} ${esc(p.name)}</span><span>Jeddah, Saudi Arabia</span>`;
}

function behave() {
  const nav = document.getElementById("nav");
  const onScroll = () => nav.classList.toggle("scrolled", scrollY > 8);
  onScroll(); addEventListener("scroll", onScroll, { passive: true });
  if (!("IntersectionObserver" in window)) return;
  const links = [...document.querySelectorAll("[data-target]")];
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle("active", a.dataset.target === e.target.id));
  }), { rootMargin: "-45% 0px -50% 0px" });
  document.querySelectorAll("main > section").forEach(s => io.observe(s));

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ro = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); ro.unobserve(e.target); }
  }));
  document.querySelectorAll("[data-reveal]").forEach(el => ro.observe(el));
}

render(PORTFOLIO);
behave();
</script>
</body>
</html>
